<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PPT Builders - Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; padding: 40px 20px; border-radius: 0 0 30px 30px; margin-bottom: 30px; }
        .project-card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .project-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="hero text-center">
        <h1>🏗️ PPT Builders</h1>
        <p class="mb-0">Live Site Status & Expense Report</p>
        <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm mt-3">Admin Login</a>
    </div>

    <div class="container">
        <div class="row">
            {% for p in stats %}
            <div class="col-md-6 mb-4">
                <div class="card project-card">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-primary">{{ p.name }}</h5>
                        <p class="text-muted small">📍 {{ p.location }}</p>
                        <hr>
                        <div class="row text-center">
                            <div class="col border-end">
                                <span class="h4 d-block text-danger">₹{{ p.expense }}</span>
                                <small class="text-muted">Total Expense</small>
                            </div>
                            <div class="col">
                                <span class="d-block fw-bold">{{ p.mistri }} Mistri</span>
                                <span class="d-block fw-bold">{{ p.labour }} Labour</span>
                                <small class="text-success">Engaged</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="text-center text-muted">No active projects to display.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
