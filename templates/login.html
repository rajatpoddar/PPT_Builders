<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Login - PPT Builders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .logo-circle {
            width: 80px; height: 80px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #eee;
            background: #f8f9fa;
        }
        .form-control:focus {
            background: white;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }
        .btn-login {
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            background: #0d6efd;
            border: none;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.4);
            transition: transform 0.2s;
        }
        .btn-login:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="logo-circle">🏗️</div>
        <h4 class="fw-bold text-dark mb-1">Welcome Back</h4>
        <p class="text-muted small mb-4">PPT Builders Manager</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}<div class="alert alert-danger py-2 small rounded-3">{{ messages[0] }}</div>{% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label class="small text-muted fw-bold ms-1">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-4 text-start">
                <label class="small text-muted fw-bold ms-1">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-login">Secure Login 🔐</button>
            <a href="{{ url_for('public_home') }}" class="btn btn-link w-100 mt-3 text-decoration-none text-muted small">← Go to Public Site</a>
        </form>
    </div>
</body>
</html>
