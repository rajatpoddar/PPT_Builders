<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - PPT Builders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background-color:#f4f6f9;display:flex;align-items:center;justify-content:center;height:100vh;}</style>
</head>
<body>
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 350px;">
        <h3 class="text-center mb-4">🔐 Admin Login</h3>
        {% with messages = get_flashed_messages() %}
          {% if messages %}<div class="alert alert-danger p-2 small">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <a href="{{ url_for('public_home') }}" class="btn btn-link w-100 mt-2">Back to Home</a>
        </form>
    </div>
</body>
</html>
