{% extends 'base.html' %}
{% block content %}

<div class="card stat-card mx-auto mt-4" style="max-width: 400px;">
    <div class="card-header bg-white text-center">
        <h5>🔐 Change Password</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="small text-muted">Current Password</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            
            <div class="mb-4">
                <label class="small text-muted">New Password</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-warning w-100">Update Password</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-link text-muted w-100 mt-2 text-decoration-none">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
